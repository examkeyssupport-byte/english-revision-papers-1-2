<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Revision · Paper 1 &amp; Paper 2</title>
<style>
/* Interactive copy of the two paper tests: same sections, same order, same questions.
   Tap questions stay taps, written questions stay typed. Extra help for a weak student: Arabic hint per section,
   tap-a-word from the word box, listen buttons, and the reason shown with every answer. */
:root{--red:#e3000f;--blue:#0b6fc2;--dk:#0a3f73;--ink:#1c1c1c;--ok:#12854a;--okbg:#d9f7e4;--bad:#c8001a;--badbg:#ffe0e3;--ans:#1a3fd0;--line:#555}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:linear-gradient(160deg,#27b3a5,#2b6cb8 60%,#2e3f9e) fixed;color:var(--ink);font:18px/1.45 Arial,"Segoe UI",system-ui,sans-serif}
.sheet{max-width:880px;margin:0 auto;background:#fff;min-height:100vh;padding:12px 16px 0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--dk);outline-offset:1px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{flex:1;border:2px solid var(--blue);background:#fff;color:var(--dk);font-weight:700;border-radius:10px;padding:8px 10px;min-height:48px}
.tab.on{background:var(--blue);color:#fff}
.head{display:grid;grid-template-columns:1.6fr 1fr auto;border:3px double #222;margin-bottom:6px}
.head>*{padding:6px 10px;border-left:3px double #222;display:flex;align-items:center;gap:6px;font-weight:700;min-width:0}
.head>*:first-child{border-left:0}
.head input{border:0;border-bottom:2px dotted #555;background:transparent;min-width:0;width:100%;color:var(--ans);font-weight:700;padding:2px}
.topic{text-align:center;color:var(--dk);font-size:.95rem;margin:0 0 4px}
h2{margin:14px 0 4px;text-align:center;color:var(--red);font-size:1.25rem}
.sec{margin:0 0 18px}
.sh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.sh h3{margin:0;color:var(--red);font-size:1.12rem;padding-top:6px}
.mark{border:1.5px solid #222;min-width:84px;text-align:center;font-weight:700;font-size:1.2rem;padding:5px 8px;white-space:nowrap}
.mark.done{color:var(--ans)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin:0 0 8px}
.hint{flex:1 1 240px;border:1.5px dashed #e0a100;border-radius:10px;background:#fff8e1}
.hint summary{cursor:pointer;font-weight:700;padding:8px 12px;min-height:40px;color:#7a5600;list-style:none}
.hint summary::-webkit-details-marker{display:none}
.hint div{padding:0 12px 10px;font:1.05rem/1.8 "Segoe UI",Tahoma,Arial,sans-serif;color:#3b2c00}
.hint b{color:var(--dk);font-family:Arial,sans-serif;unicode-bidi:isolate;direction:ltr;display:inline-block}
.say{border:1.5px solid var(--blue);background:#eef6ff;color:var(--dk);border-radius:10px;padding:6px 12px;min-height:40px;font-weight:700}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 10px}
.chip{border:1.5px solid var(--blue);background:#fff;color:var(--blue);border-radius:999px;padding:5px 14px;min-height:40px;font-weight:700;font-style:italic}
.chip.used{opacity:.35;text-decoration:line-through}
.chip.sm{font-style:normal;color:var(--ink);border-color:#9bb7d6;padding:4px 12px}
.in{color:var(--ans);font-weight:700;border:0;border-bottom:2px solid var(--line);border-radius:0;background:#f4f9ff;padding:4px 6px;width:130px;max-width:100%;margin:0 4px;min-height:38px;text-align:center}
.in.long{display:block;width:100%;margin:6px 0 0;text-align:left}
.ok{background:var(--okbg)!important;border-color:var(--ok)!important;color:#0b5c2e!important}
.bad{background:var(--badbg)!important;border-color:var(--bad)!important;color:#8f0012!important}
.fix{color:var(--ok);font-weight:700;font-size:.95rem;margin:2px 4px;display:inline-block}
.fix:before{content:"✔ "}
.why{display:block;color:#3b2c00;background:#fff8e1;border-radius:8px;padding:4px 10px;margin:4px 0 0;font:1rem/1.7 "Segoe UI",Tahoma,Arial,sans-serif;direction:rtl;text-align:right}
.why b{unicode-bidi:isolate;direction:ltr;display:inline-block;font-family:Arial,sans-serif}
.it{margin:0 0 10px}
.n{font-weight:700}
/* multiple choice, as the paper's lettered table */
.mcq{border:1.5px solid var(--line);margin:0 0 12px}
.mcq .q{display:flex;border-bottom:1.5px solid var(--line)}
.mcq .q b{width:42px;text-align:center;background:#ddd;border-right:1.5px solid var(--line);padding:6px 0;flex:none}
.mcq .q span{padding:6px 10px}
.opts{display:grid;grid-template-columns:repeat(4,1fr)}
.opt{display:flex;align-items:stretch;border:0;border-left:1.5px solid var(--line);background:#fff;padding:0;text-align:left;min-height:46px}
.opt:first-child{border-left:0}
.opt b{width:38px;display:flex;align-items:center;justify-content:center;background:#ddd;border-right:1.5px solid var(--line);flex:none}
.opt span{padding:6px 8px;align-self:center}
.opt.pick{box-shadow:0 0 0 3px #0a7a3d inset;background:#eafff1}
/* table-like rows of cells (days, months, numbers, pictures) */
.cells{display:grid;grid-template-columns:repeat(var(--n),1fr);border-top:1.5px solid var(--line);border-left:1.5px solid var(--line)}
.cell{border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line);text-align:center;display:flex;flex-direction:column;justify-content:center;min-width:0}
.cell .txt{padding:8px 2px}
.cell .hd{background:#ddd;font-weight:700;padding:5px 2px;border-bottom:1.5px solid var(--line)}
.cell img{width:100%;height:92px;object-fit:contain;padding:6px;display:block}
.cell .in{width:100%;margin:0;border-bottom:0;min-height:46px;padding:4px 2px}
.cell .fix{margin:2px 0;font-size:.85rem}
/* true / false */
.pass{margin:0 0 10px;line-height:1.6}
.tf{border-collapse:collapse;width:100%}
.tf td{border:1.5px solid var(--line);padding:0}
.tf td.k{width:44px;text-align:center;font-weight:700;background:#ddd}
.tf td.s{padding:6px 10px}
.tf td.b{width:58px}
.tfb{width:100%;min-height:46px;border:0;background:#fff;font-weight:700;font-size:1.1rem}
.tfb.pick{box-shadow:0 0 0 3px #0a7a3d inset;background:#eafff1}
/* writing */
textarea{width:100%;min-height:170px;border:0;padding:0 6px;color:var(--ans);font-weight:700;line-height:34px;resize:vertical;
  background:repeating-linear-gradient(#fff,#fff 32px,#999 32px,#999 33px,#fff 33px,#fff 34px)}
.model{border-left:4px solid var(--blue);background:#eef6ff;padding:8px 12px;margin-top:8px;color:var(--ans);text-decoration:underline}
.end{text-align:center;color:var(--blue);font:900 1.5rem/1.3 "Arial Black",Arial,sans-serif;margin:26px 0 20px}
.foot{position:sticky;bottom:0;background:#fff;border-top:3px solid var(--blue);padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin:0 -16px}
.big{font-weight:700;border:0;border-radius:12px;padding:10px 18px;background:var(--blue);color:#fff;min-height:48px}
.big.alt{background:#fff;color:var(--ink);border:2px solid #555}
.score{font-weight:800;font-size:1.2rem;text-align:center}
.score:empty{display:none}
.score small{display:block;font-weight:400;font-size:.8rem;color:#444}
@media (max-width:640px){
  body{font-size:17px}
  .sheet{padding:10px 10px 0}
  .foot{margin:0 -10px}
  .head{grid-template-columns:1fr 1fr}
  .head>*:first-child{grid-column:1/-1;border-bottom:3px double #222}
  .head>*:nth-child(2){border-left:0}
  .opts{grid-template-columns:repeat(2,1fr)}
  .opt:nth-child(3){border-left:0}
  .opt:nth-child(n+3){border-top:1.5px solid var(--line)}
  .cells{grid-template-columns:repeat(var(--m),1fr)}
  .cell{font-size:15px}
  .foot{gap:6px;padding:6px 8px}
  .big{flex:1;padding:6px 6px;font-size:.82rem;min-height:44px;line-height:1.15}
  .score{width:100%;font-size:1.05rem}
  .score small{display:inline;margin-left:6px}
}
@media print{.foot,.tabs,.tools,.say{display:none}body{background:#fff}}
</style>
</head>
<body>
<main class="sheet">
  <div class="tabs"><button class="tab" id="t0" type="button">Paper 1</button><button class="tab" id="t1" type="button">Paper 2</button></div>
  <div class="head">
    <label>Name: <input id="who" type="text" maxlength="30" autocomplete="off"></label>
    <label>Class: <input id="cls" type="text" maxlength="12" autocomplete="off"></label>
    <div>Total: <span id="tot"></span> / 20</div>
  </div>
  <p class="topic" id="topic"></p>
  <div id="p0"></div>
  <div id="p1" hidden></div>
  <div class="end">End of Questions<br>Good Luck</div>
  <div class="foot"><span class="score" id="score" aria-live="polite"></span>
    <button class="big" id="check" type="button">Check my answers</button>
    <button class="big alt" id="show" type="button" hidden>Show the answers</button>
    <button class="big alt" id="again" type="button">Start again</button></div>
</main>

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; };
const btn = (cls, html, fn) => { const b = el("button", cls, html); b.type = "button"; b.onclick = fn; return b; };
// typed answers: capitals, extra spaces, punctuation and curly/straight apostrophes do not matter
const norm = x => String(x ?? "").toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:–-]/g," ").replace(/\s+/g," ").trim();
const plain = h => { const d = el("div",null,h); return d.textContent; };
const canSay = "speechSynthesis" in window;
function say(text){ if(!canSay) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = .8; speechSynthesis.speak(u); }
const sayBtn = text => btn("say","🔊 Listen",()=>say(text));

/* ---------- build one paper; every answer registers a check {good(), mark(), reveal(), clear()} ---------- */
function build(pi){
  const P = PAPERS[pi], root = $("p"+pi), secs = []; root.innerHTML = "";
  P.secs.forEach(s => {
    if(s.g) root.append(el("h2",null,s.g));
    const sec = el("section","sec"), S = {s, checks:[], inputs:[], focus:null, chips:[]};
    const sh = el("div","sh"); sh.append(el("h3",null,s.h)); S.mark = el("div","mark","/ "+s.marks); sh.append(S.mark); sec.append(sh);
    const tools = el("div","tools");
    if(s.hint){ const d = el("details","hint"); d.append(el("summary",null,"💡 مساعدة · Help")); const b = el("div",null,s.hint); b.dir = "rtl"; d.append(b); tools.append(d); }
    sec.append(tools);

    // typed answer; alts = every accepted form
    const input = (alts, cls, why) => {
      const i = el("input","in"+(cls?" "+cls:"")); i.type = "text"; i.autocomplete = "off"; i.autocapitalize = "off"; i.spellcheck = false;
      const c = {good:()=>alts.some(x=>norm(x)===norm(i.value)), mark(){ i.classList.add(this.good()?"ok":"bad"); },
        clear(){ i.classList.remove("ok","bad"); if(this.fx){ this.fx.remove(); this.fx = null; } if(this.wy){ this.wy.remove(); this.wy = null; } },
        reveal(){ if(this.fx) return; if(!this.good()){ this.fx = el("span","fix",alts[0]); i.after(this.fx); }
          if(why){ this.wy = el("span","why",why); (i.closest(".it")||i.parentNode).append(this.wy); } }};
      i.oninput = () => { c.clear(); used(); }; i.onfocus = () => { S.focus = i; };
      S.checks.push(c); S.inputs.push(i); return i;
    };
    // one-of-many tap answer
    const choice = (buttons, a, why, host) => {
      let v = null;
      const c = {good:()=>v===a, mark(){ if(v!=null) buttons[v].classList.add(v===a?"ok":"bad"); },
        clear(){ buttons.forEach(b=>b.classList.remove("ok","bad")); if(this.wy){ this.wy.remove(); this.wy = null; } },
        reveal(){ if(this.wy) return; buttons[a].classList.add("ok"); this.wy = el("span","why",why||""); if(why) host.append(this.wy); }};
      buttons.forEach((b,k)=>{ b.onclick = () => { v = k; c.clear(); buttons.forEach((x,j)=>x.classList.toggle("pick",j===k)); b.setAttribute("aria-pressed","true"); }; });
      S.checks.push(c);
    };
    // word box: tap a word to drop it into the blank you touched (or the first empty one)
    const used = () => S.chips.forEach(([b,w]) => b.classList.toggle("used", S.inputs.some(i=>norm(i.value)===norm(w))));
    const bank = words => { const d = el("div","bank");
      words.forEach(w => { const word = Array.isArray(w) ? w[1] : w, label = Array.isArray(w) ? "<b>"+w[0]+"</b>&nbsp; "+w[1] : w;
        const b = btn("chip", label, () => { const t = (S.focus && !S.focus.value) ? S.focus : S.inputs.find(i=>!i.value) || S.focus; if(!t) return;
          t.value = word; t.dispatchEvent(new Event("input")); S.focus = null; }); S.chips.push([b,word]); d.append(b); });
      sec.append(d); if(canSay) tools.append(sayBtn(words.map(w=>Array.isArray(w)?w[1]:w).join(". "))); };

    if(s.type==="mcq"){
      s.items.forEach(it => { const box = el("div","it"), m = el("div","mcq"), q = el("div","q"); q.append(el("b",null,it.n), el("span",null,it.q));
        const o = el("div","opts"), bs = it.o.map((t,k)=>{ const b = el("button","opt"); b.type = "button"; b.append(el("b",null,"ABCD"[k]), el("span",null,t)); o.append(b); return b; });
        m.append(q,o); box.append(m); choice(bs, it.a, it.why, box); sec.append(box); });
    } else if(s.type==="pics"){
      bank(s.bank);
      const g = el("div","cells"); g.style.setProperty("--n", s.items.length); g.style.setProperty("--m", 2);
      s.items.forEach(it => { const c = el("div","cell"), im = el("img"); im.src = IMG[it.img]; im.alt = "picture "+it.n;
        const letter = s.bank.find(b=>b[1]===it.a)[0], i = input([it.a, letter]); i.setAttribute("aria-label","word for picture "+it.n);
        c.append(im, el("div","hd",it.n), i); c.querySelector(".hd").style.borderTop = "1.5px solid var(--line)"; g.append(c); });
      sec.append(g);
    } else if(s.type==="fill"){
      bank(s.bank);
      s.items.forEach(it => { const d = el("div","it"), parts = it.t.split("{}"); d.append(el("span","n",it.n+"- "), el("span",null,parts[0]));
        const i = input(it.a, "", it.why); i.setAttribute("aria-label","answer "+it.n); d.append(i, el("span",null,parts[1])); sec.append(d); });
    } else if(s.type==="cells"){
      bank(s.bank);
      const g = el("div","cells"); g.style.setProperty("--n", s.n); g.style.setProperty("--m", s.m);
      s.cells.forEach(c => { const d = el("div","cell");
        if(typeof c==="string") d.append(el("div","txt",c));
        else { if(c.hd) d.append(el("div","hd",c.hd)); const i = input([c.a]); i.setAttribute("aria-label", c.hd ? plain(c.hd) : "missing word"); d.append(i); }
        g.append(d); });
      sec.append(g);
    } else if(s.type==="order"){
      s.items.forEach(it => { const d = el("div","it"); d.append(el("span","n",it.n+". "), el("span",null,it.w.join(" / ")));
        const row = el("div","bank"); row.style.justifyContent = "flex-start"; row.style.margin = "6px 0 0";
        const i = input(it.a, "long", it.why); i.setAttribute("aria-label","sentence "+it.n);
        const cs = it.w.map(w => btn("chip sm", w, e => { i.value = (i.value + (w==="?" ? "" : " ") + w).trim(); e.currentTarget.classList.add("used"); i.dispatchEvent(new Event("input")); }));
        const clr = btn("chip sm","⌫", () => { i.value = ""; cs.forEach(c=>c.classList.remove("used")); i.dispatchEvent(new Event("input")); }); clr.setAttribute("aria-label","clear sentence "+it.n);
        row.append(...cs, clr); d.append(row, i); sec.append(d); });
    } else if(s.type==="fix"){
      s.items.forEach(it => { const d = el("div","it"); d.append(el("span","n",it.n+". "), el("span",null,it.t));
        const i = input(it.a, "long", it.why); i.setAttribute("aria-label","correct sentence "+it.n); d.append(i); sec.append(d); });
    } else if(s.type==="tf"){
      const p = el("div","pass", s.pass.join("<br>")); sec.append(p); if(canSay) tools.append(sayBtn(plain(s.pass.join(" "))));
      const tb = el("table","tf");
      s.items.forEach(it => { const tr = el("tr"), st = el("td","s",it.q), bs = ["T","F"].map(x=>{ const b = el("button","tfb",x); b.type = "button"; b.setAttribute("aria-label",(x==="T"?"True":"False")+" for sentence "+it.n); return b; });
        const a = el("td","b"), b2 = el("td","b"); a.append(bs[0]); b2.append(bs[1]); tr.append(el("td","k",it.n), st, a, b2); tb.append(tr); choice(bs, it.a?0:1, it.why, st); });
      sec.append(tb);
    } else if(s.type==="write"){
      S.write = true;
      const row = el("div","bank"); row.style.justifyContent = "flex-start"; const ta = el("textarea"); ta.spellcheck = false; ta.setAttribute("aria-label","your writing");
      s.starters.forEach(t => row.append(btn("chip sm", t.trim(), () => { ta.value += (ta.value && !/\s$/.test(ta.value) ? " " : "") + t; ta.focus(); })));
      const model = el("div","model", s.model); model.hidden = true;
      const mb = btn("say","Show a model answer", () => { model.hidden = !model.hidden; mb.textContent = model.hidden ? "Show a model answer" : "Hide the model answer"; });
      sec.append(row, ta, mb, model); if(canSay) tools.append(sayBtn(s.model.replace(/ ([.,])/g,"$1")));
    }
    if(!tools.children.length) tools.remove();
    root.append(sec); secs.push(S);
  });
  return secs;
}

/* ---------- page ---------- */
let cur = 0; const built = [build(0), build(1)], checked = [false,false];
const half = x => Math.round(x*2)/2;
function grade(reveal){
  let got = 0, max = 0, hand = 0;
  built[cur].forEach(S => {
    if(S.write){ hand += S.s.marks; return; }
    S.checks.forEach(c => { c.clear(); c.mark(); if(reveal) c.reveal(); });
    const m = half(S.checks.filter(c=>c.good()).length / S.checks.length * S.s.marks); got += m; max += S.s.marks;
    S.mark.textContent = m+" / "+S.s.marks; S.mark.classList.add("done");
  });
  checked[cur] = true; $("tot").textContent = got;
  $("score").innerHTML = got+" / "+max+(got===max ? "  ★ Excellent!" : got>=max*.75 ? "  Very good!" : got>=max*.5 ? "  Good, try again!" : "  Open 💡 and try again!")+"<small>+ Writing ( / "+hand+" ) with your teacher</small>";
  $("score").style.color = got===max ? "var(--ok)" : "";
  $("show").hidden = got===max && reveal;
}
function tab(i){ cur = i; speechSynthesis && canSay && speechSynthesis.cancel(); $("p0").hidden = i!==0; $("p1").hidden = i!==1; $("t0").className = "tab"+(i===0?" on":""); $("t1").className = "tab"+(i===1?" on":"");
  $("topic").textContent = PAPERS[i].topic; $("score").textContent = ""; $("tot").textContent = ""; $("show").hidden = true;
  if(checked[i]) grade(false); }
$("t0").onclick = () => { tab(0); scrollTo(0,0); };
$("t1").onclick = () => { tab(1); scrollTo(0,0); };
$("check").onclick = () => grade(false);
$("show").onclick = () => grade(true);
$("again").onclick = () => { built[cur] = build(cur); checked[cur] = false; tab(cur); scrollTo({top:0,behavior:"smooth"}); };
tab(0);
</script>
